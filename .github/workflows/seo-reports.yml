name: Monthly SEO reports

on:
  schedule:
    - cron: "17 10 5 * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Use mock for a demonstration or openseo for real reports"
        type: choice
        options: [mock, openseo]
        default: mock
      period:
        description: "Optional YYYY-MM; blank uses the last complete month"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: monthly-seo-reports
  cancel-in-progress: false

jobs:
  report:
    # Run scheduled and manual reports from the default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROVIDER: ${{ inputs.provider || 'openseo' }}
      REPORT_PERIOD: ${{ inputs.period }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required secrets
        env:
          OPENSEO_ACCESS_TOKEN: ${{ secrets.OPENSEO_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ "$PROVIDER" == openseo && ( -z "$OPENSEO_ACCESS_TOKEN" || -z "$OPENAI_API_KEY" ) ]]; then
            echo "::error::Add OPENSEO_ACCESS_TOKEN and OPENAI_API_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Install pipeline and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          python -m pip install .

      - name: Generate reports
        id: reports
        env:
          OPENSEO_ACCESS_TOKEN: ${{ secrets.OPENSEO_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
        run: |
          args=(report --site all --provider "$PROVIDER")
          if [[ -n "$REPORT_PERIOD" ]]; then
            args+=(--period "$REPORT_PERIOD")
          fi
          seo-pipeline "${args[@]}"

      - name: Save PDF reports
        if: ${{ always() && (steps.reports.outcome == 'success' || steps.reports.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          # Direct uploads require one file: config/sites.yaml contains only Edwardscapes.
          path: output/**/*.pdf
          archive: false
          retention-days: 90
          if-no-files-found: warn

      - name: Clean up runner files
        if: always()
        run: |
          rm -rf data/snapshots output
