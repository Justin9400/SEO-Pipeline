[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "seo-metrics-pipeline"
version = "0.1.0"
description = "Multi-site SEO metrics collection, comparison, analysis, and reporting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Justin9400" }]
dependencies = [
  "httpx>=0.28,<1",
  "Jinja2>=3.1,<4",
  "mcp>=1.27,<2",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "WeasyPrint>=65,<70",
]

[project.optional-dependencies]
dev = [
  "pdfplumber>=0.11,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
seo-pipeline = "seo_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/seo_pipeline/templates" = "seo_pipeline/templates"
"src/seo_pipeline/fixtures" = "seo_pipeline/fixtures"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["seo_pipeline"]

