[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-pipeline"
version = "1.0.0"
description = "Independent multi-site SEO metrics and reporting"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "openai>=2,<3", "Jinja2>=3.1,<4", "WeasyPrint>=65,<71", "mcp>=1.12,<2", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "pymupdf>=1.25"]

[project.scripts]
seo-pipeline = "seo_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seo_pipeline = ["templates/customer_report/*", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
